name: Secret Scan

# Full-history gitleaks scan on every push to main and every PR.
# Config: .gitleaks.toml at repo root (extends default rules; 5 reviewed-benign
# historical findings are allowlisted by commit — see config comments).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
