# Rate Limiting Zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=40r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=15r/s;

# Microcache Zone for Public Store APIs (Products, Categories, Brands, Settings)
proxy_cache_path /tmp/nginx_api_cache levels=1:2 keys_zone=API_CACHE:10m max_size=100m inactive=10m use_temp_path=off;

server {
    listen 80;
    server_name janebiarena.ir www.janebiarena.ir mail.janebiarena.ir 45.82.137.67;

    # Enamad verification file on HTTP without redirect
    location ~* ^/\d+\.txt$ {
        root /home/ubuntu/Janebi-Store/dist;
        try_files $uri =404;
    }

    location / {
        return 301 https://janebiarena.ir$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name janebiarena.ir mail.janebiarena.ir;

    ssl_certificate /etc/letsencrypt/live/janebiarena.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/janebiarena.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    root /home/ubuntu/Janebi-Store/dist;

    # 1. High-Speed Cached Public Store APIs (Edge/CDN Ready)
    location ~* ^/api/(products|categories|brands|settings) {
        proxy_cache API_CACHE;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 15s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_bypass $http_cache_control;
        add_header X-Proxy-Cache $upstream_cache_status;
        add_header Cache-Control "public, max-age=15, s-maxage=60, stale-while-revalidate=120";

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # 2. Auth APIs (No cache, strict rate limiting)
    location ~* ^/api/auth/ {
        limit_req zone=auth_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # 3. Other General APIs
    location ~* ^/api/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # 4. Direct Disk Serving for Assets (1 Year Immutable Cache)
    # Direct Disk Serving for Local Fonts
    location ~* ^/fonts/.*\.(woff2?|ttf|eot|otf)$ {
        root /home/ubuntu/Janebi-Store/dist;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
        access_log off;
    }

    location ~* ^/assets/.*\.(js|css|woff2?|ttf|eot)$ {
        root /home/ubuntu/Janebi-Store/dist;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
        access_log off;
    }

    # 5. Direct Disk Serving for Images & SVGs (30 Days Cache)
    location ~* ^/(products|brands)/.*\.(svg|png|jpg|jpeg|webp|ico)$ {
        root /home/ubuntu/Janebi-Store/dist;
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
        access_log off;
    }

    # Webmail Interface
    location /webmail {
        alias /var/lib/roundcube/public_html;
        index index.php;

        location ~ ^/webmail/(.+\.php)$ {
            alias /var/lib/roundcube/public_html/$1;
            fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/lib/roundcube/public_html/$1;
        }

        location ~* ^/webmail/(.+\.(jpg|jpeg|gif|css|png|js|ico|html|xml|txt))$ {
            alias /var/lib/roundcube/public_html/$1;
            expires 1h;
            access_log off;
        }
    }

    # 6. SPA Entry Point (No-Cache index.html)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        add_header Cache-Control "no-cache, must-revalidate";  # no-store blocked bfcache
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}

# www host: the Let's Encrypt cert covers it, so answer and permanently redirect to
# the apex. Two hostnames serving the same storefront is duplicate content — the
# canonical tag already handled it, a 301 makes the signal explicit (bfcache/crawl
# budget too: nothing is ever fetched from www again).
server {
    listen 443 ssl http2;
    server_name www.janebiarena.ir;

    ssl_certificate /etc/letsencrypt/live/janebiarena.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/janebiarena.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://janebiarena.ir$request_uri;
}
