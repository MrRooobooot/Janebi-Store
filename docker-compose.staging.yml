services:
  staging-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: janebi-store-staging
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - NODE_ENV=staging
      - PORT=3000
      - DATABASE_URL=./data/janebi-staging.db
    volumes:
      - ./data-staging:/app/data
      - ./public/products:/app/public/products
