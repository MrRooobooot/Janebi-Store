services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: janebi-store
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=./data/janebi.db
    volumes:
      - ./dist:/app/dist
      - ./data:/app/data
      - ./public/products:/app/public/products
      - ./public/images:/app/public/images
