services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: janebi-store
    restart: always
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:postgres@db:5432/janebi}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-janebi_secret_access_production_key_2026_secure}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-janebi_secret_refresh_production_key_2026_secure}
      - ZARINPAL_MERCHANT_ID=${ZARINPAL_MERCHANT_ID:-xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx}
      - ZARINPAL_SANDBOX=${ZARINPAL_SANDBOX:-true}
      - APP_URL=${APP_URL:-http://45.82.137.67}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: janebi-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      # Must match the credentials embedded in DATABASE_URL above.
      # Override both via .env (POSTGRES_PASSWORD / DATABASE_URL) in production.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: janebi
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - janebi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d janebi"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  janebi_pgdata:
