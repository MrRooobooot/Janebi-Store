services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: janebi-store
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=./data/janebi.db
    volumes:
      - ./dist:/app/dist
      - ./data:/app/data
      - ./public/products:/app/public/products

  postgres:
    image: postgres:15-alpine
    container_name: janebi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: janebi
      POSTGRES_USER: janebi_user
      POSTGRES_PASSWORD: janebi_secure_password
    volumes:
      - janebi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U janebi_user -d janebi"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  janebi_pgdata:
