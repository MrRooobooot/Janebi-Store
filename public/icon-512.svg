<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pwaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <filter id="pwaShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Background Container -->
  <rect width="512" height="512" rx="128" fill="#08090a"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#pwaBg)" filter="url(#pwaShadow)"/>
  
  <!-- Subtle Grid Accent -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>

  <!-- Center Smartphone / Shopping Symbol -->
  <g transform="translate(156, 126)" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- Phone Body -->
    <rect x="10" y="0" width="180" height="260" rx="36" />
    <!-- Screen Notch/Speaker -->
    <line x1="80" y1="32" x2="120" y2="32" stroke-width="18"/>
    <!-- Center Bolt / Energy -->
    <path d="M105 90 L85 140 L115 140 L95 190" stroke="#fef08a" stroke-width="20" fill="none"/>
    <!-- Bottom Home Indicator -->
    <circle cx="100" cy="226" r="8" fill="#ffffff"/>
  </g>
</svg>
