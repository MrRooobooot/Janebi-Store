<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_cas4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#581c87" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="case_silicone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6b21a8" />
      <stop offset="50%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>
    <filter id="shadow_cas4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#a855f7" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="36" fill="url(#bg_cas4)" />
  <rect x="2" y="2" width="396" height="396" rx="34" fill="none" stroke="#a855f7" stroke-opacity="0.25" stroke-width="2" />

  <circle cx="200" cy="200" r="135" fill="#a855f7" opacity="0.08" />

  <!-- Phone Case Geometry (Centered at cx=200, cy=200) -->
  <g filter="url(#shadow_cas4)">
    <!-- Main Case Body -->
    <rect x="135" y="80" width="130" height="240" rx="36" fill="url(#case_silicone)" stroke="#c084fc" stroke-width="2.5" />

    <!-- Camera Plateau (Top Left) -->
    <rect x="145" y="92" width="48" height="52" rx="14" fill="#3b0764" stroke="#a855f7" stroke-width="1.5" />
    <!-- 3 Lenses -->
    <circle cx="158" cy="105" r="7" fill="#0f172a" stroke="#c084fc" stroke-width="1.5" />
    <circle cx="158" cy="131" r="7" fill="#0f172a" stroke="#c084fc" stroke-width="1.5" />
    <circle cx="180" cy="118" r="7" fill="#0f172a" stroke="#c084fc" stroke-width="1.5" />

    <!-- MagSafe Ring (Centered at cx=200, cy=205) -->
    <circle cx="200" cy="205" r="40" fill="none" stroke="#e9d5ff" stroke-width="5" stroke-dasharray="10 4" opacity="0.85" />
    <rect x="198" y="248" width="4" height="18" rx="2" fill="#e9d5ff" opacity="0.85" />

    <!-- Apple Logo Subtle Deboss -->
    <circle cx="200" cy="205" r="8" fill="#e9d5ff" opacity="0.4" />
  </g>
</svg>
