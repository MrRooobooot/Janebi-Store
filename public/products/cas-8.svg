<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_cas8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="armor_body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow_cas8" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="36" fill="url(#bg_cas8)" />
  <rect x="2" y="2" width="396" height="396" rx="34" fill="none" stroke="#64748b" stroke-opacity="0.25" stroke-width="2" />

  <circle cx="200" cy="200" r="135" fill="#64748b" opacity="0.08" />

  <!-- Armor Phone Case (Centered at cx=200, cy=200) -->
  <g filter="url(#shadow_cas8)">
    <!-- Reinforced Heavy Duty Bumper -->
    <rect x="132" y="78" width="136" height="244" rx="36" fill="url(#armor_body)" stroke="#0ea5e9" stroke-width="2" />

    <!-- Corner Shock Absorbers -->
    <rect x="130" y="80" width="16" height="24" rx="6" fill="#0ea5e9" opacity="0.8" />
    <rect x="254" y="80" width="16" height="24" rx="6" fill="#0ea5e9" opacity="0.8" />
    <rect x="130" y="296" width="16" height="24" rx="6" fill="#0ea5e9" opacity="0.8" />
    <rect x="254" y="296" width="16" height="24" rx="6" fill="#0ea5e9" opacity="0.8" />

    <!-- CamShield Slider Lid (Top) -->
    <rect x="145" y="90" width="110" height="50" rx="12" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5" />
    <!-- Diagonal Grips on Slider -->
    <line x1="180" y1="102" x2="220" y2="102" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <line x1="180" y1="115" x2="220" y2="115" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <line x1="180" y1="128" x2="220" y2="128" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />

    <!-- Carbon Fiber Back Panel Lines -->
    <rect x="145" y="155" width="110" height="150" rx="16" fill="#1e293b" opacity="0.6" stroke="#475569" stroke-width="1" />
    <line x1="155" y1="180" x2="245" y2="180" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="155" y1="210" x2="245" y2="210" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="155" y1="240" x2="245" y2="240" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="155" y1="270" x2="245" y2="270" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
  </g>
</svg>
