<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_cbl11" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172554" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="cbl_white" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="shadow_cbl11" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#3b82f6" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="36" fill="url(#bg_cbl11)" />
  <rect x="2" y="2" width="396" height="396" rx="34" fill="none" stroke="#3b82f6" stroke-opacity="0.25" stroke-width="2" />

  <circle cx="200" cy="200" r="130" fill="#3b82f6" opacity="0.08" />

  <!-- Cable Coil & Lightning Head (Centered at cx=200, cy=200) -->
  <g filter="url(#shadow_cbl11)">
    <!-- White Braided Loop -->
    <path d="M 130 250 C 100 140, 300 140, 270 250 C 260 290, 140 290, 130 250" fill="none" stroke="url(#cbl_white)" stroke-width="16" stroke-linecap="round" />
    
    <!-- Lightning Connector Head (Top Centered) -->
    <g transform="translate(180, 105)">
      <!-- Strain Boot -->
      <rect x="14" y="65" width="12" height="24" rx="4" fill="#e2e8f0" />
      <!-- White Plastic Shell -->
      <rect x="9" y="28" width="22" height="40" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" />
      <!-- Lightning Metal Plug -->
      <rect x="12" y="10" width="16" height="20" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" />
      <!-- 8 Gold Pins -->
      <rect x="14.5" y="13" width="11" height="4" rx="1" fill="#eab308" />
    </g>

    <!-- MFi Certified Chip Badge in Center -->
    <circle cx="200" cy="235" r="24" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2" />
    <path d="M 192 235 L 198 241 L 210 228" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
