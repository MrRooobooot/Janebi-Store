<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="charger_body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="charger_face" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="port_glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="charger_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="36" fill="#f8fafc" fill-opacity="0.04" />

  <!-- 3D GaN Fast Charger Body -->
  <g filter="url(#charger_shadow)">
    <!-- Main Cube Body -->
    <rect x="110" y="90" width="180" height="200" rx="32" fill="url(#charger_body)" />
    
    <!-- Top Chamfer Accent -->
    <path d="M120 90 L280 90 A20 20 0 0 1 290 105 L110 105 A20 20 0 0 1 120 90 Z" fill="#ffffff" opacity="0.8" />
    
    <!-- Front Port Panel -->
    <rect x="135" y="125" width="130" height="135" rx="20" fill="url(#charger_face)" />
    
    <!-- USB-C Port 1 (GaN 65W) -->
    <rect x="160" y="145" width="80" height="22" rx="11" fill="#020617" stroke="url(#port_glow)" stroke-width="2" />
    <rect x="175" y="153" width="50" height="6" rx="3" fill="url(#port_glow)" />
    <text x="200" y="180" font-family="sans-serif" font-size="10" font-weight="900" fill="#94a3b8" text-anchor="middle">USB-C1 (65W)</text>

    <!-- USB-C Port 2 (20W) -->
    <rect x="165" y="195" width="70" height="18" rx="9" fill="#020617" stroke="#38bdf8" stroke-width="1.5" />
    <rect x="180" y="201" width="40" height="6" rx="3" fill="#38bdf8" />
    <text x="200" y="226" font-family="sans-serif" font-size="9" font-weight="bold" fill="#64748b" text-anchor="middle">USB-C2 (20W)</text>

    <!-- Base Prong Accent -->
    <rect x="160" y="290" width="25" height="40" rx="6" fill="#94a3b8" />
    <rect x="215" y="290" width="25" height="40" rx="6" fill="#94a3b8" />
  </g>
</svg>
