<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_chg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#431407" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#9a3412" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="gan_body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <filter id="shadow_chg2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#f97316" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="36" fill="url(#bg_chg2)" />
  <rect x="2" y="2" width="396" height="396" rx="34" fill="none" stroke="#f97316" stroke-opacity="0.25" stroke-width="2" />

  <circle cx="200" cy="200" r="135" fill="#f97316" opacity="0.08" />

  <!-- GaN Charger (Centered at cx=200, cy=200) -->
  <g filter="url(#shadow_chg2)">
    <!-- Plug Pins (Top) -->
    <rect x="168" y="80" width="12" height="42" rx="6" fill="#a1a1aa" />
    <rect x="220" y="80" width="12" height="42" rx="6" fill="#a1a1aa" />

    <!-- Pin Neck Transition -->
    <path d="M 152 118 L 248 118 L 260 142 L 140 142 Z" fill="#27272a" />

    <!-- Main GaN Fast Charger Body -->
    <rect x="135" y="142" width="130" height="150" rx="30" fill="url(#gan_body)" stroke="#f97316" stroke-width="2.5" />

    <!-- GaN Power Accent Line -->
    <rect x="155" y="162" width="90" height="24" rx="12" fill="#27272a" stroke="#f97316" stroke-width="1.5" />
    <text x="200" y="178" font-family="sans-serif" font-size="11" font-weight="900" fill="#f97316" text-anchor="middle">GaN FAST 20W</text>

    <!-- Center Voltage Indicator Ring -->
    <circle cx="200" cy="215" r="14" fill="#27272a" stroke="#fbbf24" stroke-width="2" />
    <path d="M 202 206 L 195 216 L 201 216 L 198 224 L 205 214 L 199 214 Z" fill="#fbbf24" />

    <!-- Type-C USB-PD Port (Bottom) -->
    <rect x="175" y="248" width="50" height="18" rx="9" fill="#09090b" stroke="#f97316" stroke-width="2" />
    <rect x="187" y="254" width="26" height="6" rx="3" fill="#fbbf24" />
  </g>
</svg>
