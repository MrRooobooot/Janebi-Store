<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_chg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="charger_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow_chg5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0284c7" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="36" fill="url(#bg_chg5)" />
  <rect x="2" y="2" width="396" height="396" rx="34" fill="none" stroke="#0284c7" stroke-opacity="0.25" stroke-width="2" />

  <!-- Center Circle -->
  <circle cx="200" cy="200" r="130" fill="#0284c7" opacity="0.08" />
  <circle cx="200" cy="200" r="105" fill="#0284c7" opacity="0.12" />

  <!-- Charger Plug & Body (Centered at cx=200, cy=200) -->
  <g filter="url(#shadow_chg5)">
    <!-- Plug Pins (Top) -->
    <rect x="168" y="85" width="12" height="38" rx="6" fill="#94a3b8" />
    <rect x="220" y="85" width="12" height="38" rx="6" fill="#94a3b8" />

    <!-- Pin Base Neck -->
    <path d="M 155 120 L 245 120 L 255 145 L 145 145 Z" fill="#1e293b" />

    <!-- Main Cube Body -->
    <rect x="135" y="145" width="130" height="150" rx="28" fill="url(#charger_grad)" stroke="#0284c7" stroke-width="2.5" />

    <!-- Fast Charging Indicator Badge -->
    <circle cx="200" cy="195" r="20" fill="#0284c7" opacity="0.2" />
    <path d="M 203 182 L 193 197 L 202 197 L 197 212 L 208 195 L 199 195 Z" fill="#38bdf8" />

    <!-- Type-C Output Port (Bottom) -->
    <rect x="175" y="245" width="50" height="18" rx="9" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <rect x="187" y="251" width="26" height="6" rx="3" fill="#38bdf8" />
  </g>
</svg>
