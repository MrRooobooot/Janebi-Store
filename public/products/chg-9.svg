<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_chg9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="puck_metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="shadow_chg9" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#a855f7" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="36" fill="url(#bg_chg9)" />
  <rect x="2" y="2" width="396" height="396" rx="34" fill="none" stroke="#a855f7" stroke-opacity="0.25" stroke-width="2" />

  <!-- Outer Glow Rings -->
  <circle cx="200" cy="200" r="140" fill="#a855f7" opacity="0.08" />
  <circle cx="200" cy="200" r="115" fill="#a855f7" opacity="0.12" />

  <!-- MagSafe Magnetic Puck & Cord (Centered at cx=200, cy=200) -->
  <g filter="url(#shadow_chg9)">
    <!-- Cable Coming Out From Bottom -->
    <path d="M 200 290 L 200 360" stroke="#cbd5e1" stroke-width="12" stroke-linecap="round" />
    <rect x="194" y="280" width="12" height="20" rx="4" fill="#94a3b8" />

    <!-- Outer Metal Aluminum Ring -->
    <circle cx="200" cy="200" r="90" fill="url(#puck_metal)" stroke="#a855f7" stroke-width="2" />

    <!-- Inner White Silicone Charging Surface -->
    <circle cx="200" cy="200" r="75" fill="#ffffff" />

    <!-- MagSafe Ring Indicator -->
    <circle cx="200" cy="200" r="48" fill="none" stroke="#c084fc" stroke-width="6" stroke-dasharray="14 6" opacity="0.8" />
    
    <!-- Center Alignment Indicator -->
    <circle cx="200" cy="200" r="18" fill="none" stroke="#a855f7" stroke-width="4" />
    <path d="M 202 190 L 196 200 L 201 200 L 198 210 L 204 199 L 199 199 Z" fill="#a855f7" />
  </g>
</svg>
