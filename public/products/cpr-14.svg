<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_cpr14" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="protector_spiral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <filter id="shadow_cpr14" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#ea580c" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="36" fill="url(#bg_cpr14)" />
  <rect x="2" y="2" width="396" height="396" rx="34" fill="none" stroke="#f97316" stroke-opacity="0.25" stroke-width="2" />

  <circle cx="200" cy="200" r="135" fill="#f97316" opacity="0.08" />

  <!-- Cable Protector Bite & Spiral (Centered at cx=200, cy=200) -->
  <g filter="url(#shadow_cpr14)">
    <!-- Inner Cable Wire (Running Through) -->
    <rect x="192" y="70" width="16" height="260" rx="8" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5" />
    
    <!-- Top Connector Plug Shell -->
    <rect x="180" y="80" width="40" height="45" rx="10" fill="#0f172a" stroke="#f97316" stroke-width="2" />
    <rect x="188" y="65" width="24" height="20" rx="4" fill="#94a3b8" />

    <!-- Silicone Bumper Head (Protector Collar) -->
    <rect x="165" y="120" width="70" height="45" rx="18" fill="url(#protector_spiral)" stroke="#fed7aa" stroke-width="2" />
    <circle cx="185" cy="142" r="5" fill="#ffffff" />
    <circle cx="215" cy="142" r="5" fill="#ffffff" />

    <!-- Spiral Bumper Ribs (Segments) -->
    <rect x="175" y="175" width="50" height="22" rx="10" fill="#f97316" stroke="#fed7aa" stroke-width="1.5" />
    <rect x="178" y="205" width="44" height="22" rx="10" fill="#ea580c" stroke="#fed7aa" stroke-width="1.5" />
    <rect x="181" y="235" width="38" height="22" rx="10" fill="#c2410c" stroke="#fed7aa" stroke-width="1.5" />
    <rect x="184" y="265" width="32" height="22" rx="10" fill="#9a3412" stroke="#fed7aa" stroke-width="1.5" />
    <rect x="187" y="295" width="26" height="20" rx="8" fill="#7c2d12" stroke="#fed7aa" stroke-width="1.5" />
  </g>
</svg>
