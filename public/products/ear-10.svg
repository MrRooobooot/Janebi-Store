<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_ear10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="stem_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="tip_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="shadow_ear10" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0d9488" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="36" fill="url(#bg_ear10)" />
  <rect x="2" y="2" width="396" height="396" rx="34" fill="none" stroke="#14b8a6" stroke-opacity="0.25" stroke-width="2" />

  <!-- Outer Centered Ring -->
  <circle cx="200" cy="200" r="125" fill="#14b8a6" opacity="0.08" />
  <circle cx="200" cy="200" r="100" fill="#14b8a6" opacity="0.12" />

  <!-- Pair of Earbuds (Symmetric Placement around cx=200, cy=200) -->
  <g filter="url(#shadow_ear10)">
    <!-- Left Earbud -->
    <g transform="translate(145, 140) rotate(-15 40 60)">
      <!-- Head -->
      <circle cx="40" cy="35" r="26" fill="url(#stem_grad)" />
      <!-- Silicone Tip -->
      <ellipse cx="20" cy="30" rx="14" ry="18" fill="url(#tip_grad)" />
      <!-- Stem -->
      <rect x="34" y="45" width="12" height="65" rx="6" fill="url(#stem_grad)" />
      <!-- Mic Hole -->
      <circle cx="40" cy="102" r="2" fill="#64748b" />
    </g>

    <!-- Right Earbud -->
    <g transform="translate(215, 140) rotate(15 40 60)">
      <!-- Head -->
      <circle cx="40" cy="35" r="26" fill="url(#stem_grad)" />
      <!-- Silicone Tip -->
      <ellipse cx="60" cy="30" rx="14" ry="18" fill="url(#tip_grad)" />
      <!-- Stem -->
      <rect x="34" y="45" width="12" height="65" rx="6" fill="url(#stem_grad)" />
      <!-- Mic Hole -->
      <circle cx="40" cy="102" r="2" fill="#64748b" />
    </g>
  </g>
</svg>
