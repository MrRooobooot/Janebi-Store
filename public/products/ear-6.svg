<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_ear6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#4338ca" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="case_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="bud_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="shadow_ear6" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#4f46e5" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="36" fill="url(#bg_ear6)" />
  <rect x="2" y="2" width="396" height="396" rx="34" fill="none" stroke="#6366f1" stroke-opacity="0.25" stroke-width="2" />

  <!-- Outer Glowing Backdrop Circle (Centered exactly at cx=200, cy=200) -->
  <circle cx="200" cy="200" r="130" fill="#6366f1" opacity="0.08" />
  <circle cx="200" cy="200" r="105" fill="#6366f1" opacity="0.12" />

  <!-- TWS Charging Case Body (Centered at cx=200, cy=200) -->
  <g filter="url(#shadow_ear6)">
    <!-- Case Base -->
    <rect x="110" y="120" width="180" height="160" rx="65" fill="url(#case_grad)" stroke="#6366f1" stroke-width="3" />
    <!-- Case Opening Seam -->
    <path d="M 112 180 Q 200 195 288 180" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.7" />
    <!-- Status LED Indicator -->
    <circle cx="200" cy="225" r="4.5" fill="#38bdf8" />
    <circle cx="200" cy="225" r="8" fill="#38bdf8" opacity="0.4" />
    
    <!-- Left Earbud Top Surface -->
    <circle cx="158" cy="155" r="22" fill="url(#bud_grad)" />
    <circle cx="158" cy="155" r="14" fill="#1e1b4b" opacity="0.6" />
    <circle cx="158" cy="155" r="6" fill="#818cf8" />

    <!-- Right Earbud Top Surface -->
    <circle cx="242" cy="155" r="22" fill="url(#bud_grad)" />
    <circle cx="242" cy="155" r="14" fill="#1e1b4b" opacity="0.6" />
    <circle cx="242" cy="155" r="6" fill="#818cf8" />
  </g>
</svg>
