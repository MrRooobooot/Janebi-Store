<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_ear6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.16" />
    </linearGradient>
    <linearGradient id="pod_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="shadow_pod" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" rx="32" fill="url(#bg_ear6)" />

  <!-- Charging Case Silhouette -->
  <rect x="110" y="110" width="180" height="180" rx="60" fill="url(#pod_grad)" filter="url(#shadow_pod)" />
  <rect x="112" y="195" width="176" height="2" fill="#cbd5e1" />
  <circle cx="200" cy="220" r="4" fill="#22c55e" />

  <!-- Left Earbud Top Detail -->
  <ellipse cx="160" cy="160" rx="24" ry="20" fill="#0f172a" opacity="0.08" />
  <circle cx="160" cy="160" r="14" fill="#334155" />

  <!-- Right Earbud Top Detail -->
  <ellipse cx="240" cy="160" rx="24" ry="20" fill="#0f172a" opacity="0.08" />
  <circle cx="240" cy="160" r="14" fill="#334155" />
</svg>
