<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_ear-" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.22" />
    </linearGradient>
    <linearGradient id="icon_grad_ear-" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="shadow_ear-" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4f46e5" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="400" rx="36" fill="url(#grad_ear-)" />
  <rect x="1.5" y="1.5" width="397" height="397" rx="34.5" fill="none" stroke="#6366f1" stroke-opacity="0.25" stroke-width="2" />

  <!-- Center Circle -->
  <circle cx="200" cy="175" r="90" fill="white" filter="url(#shadow_ear-)" />
  <circle cx="200" cy="175" r="76" fill="url(#icon_grad_ear-)" />

  <!-- Inner Device Illustration -->
  <g transform="translate(160, 135) scale(1.6)" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="5" y="2" width="14" height="20" rx="2" ry="2" />
    <line x1="12" y1="18" x2="12.01" y2="18" />
  </g>

  <!-- Brand Pill -->
  <rect x="130" y="285" width="140" height="32" rx="16" fill="white" filter="url(#shadow_ear-)" />
  <text x="200" y="306" font-family="sans-serif" font-size="14" font-weight="900" fill="#4f46e5" text-anchor="middle">SAMSUNG</text>

  <!-- Bottom Subtitle -->
  <text x="200" y="345" font-family="sans-serif" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">Galaxy Buds2 Pro</text>
</svg>