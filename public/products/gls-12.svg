<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_gls12" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#15803d" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="ceramic_surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.8" />
    </linearGradient>
    <filter id="shadow_gls12" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#22c55e" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="36" fill="url(#bg_gls12)" />
  <rect x="2" y="2" width="396" height="396" rx="34" fill="none" stroke="#22c55e" stroke-opacity="0.25" stroke-width="2" />

  <circle cx="200" cy="200" r="135" fill="#22c55e" opacity="0.08" />

  <!-- Flexible Ceramic Screen Protector (Centered at cx=200, cy=200) -->
  <g filter="url(#shadow_gls12)">
    <!-- Outer Edge -->
    <rect x="135" y="75" width="130" height="250" rx="28" fill="#022c22" stroke="#22c55e" stroke-width="2" />
    
    <!-- Matte Ceramic Coating Surface -->
    <rect x="140" y="80" width="120" height="240" rx="24" fill="url(#ceramic_surface)" stroke="#86efac" stroke-width="1.5" />

    <!-- Speaker Notch -->
    <rect x="180" y="88" width="40" height="4" rx="2" fill="#022c22" />
    <circle cx="200" cy="100" r="3" fill="#022c22" />

    <!-- Anti-Fingerprint Badge (Center) -->
    <circle cx="200" cy="200" r="28" fill="#14532d" stroke="#4ade80" stroke-width="2" />
    <text x="200" y="196" font-family="sans-serif" font-size="11" font-weight="bold" fill="#86efac" text-anchor="middle">CERAMIC</text>
    <text x="200" y="214" font-family="sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle">MATTE</text>

    <!-- Silk Glare -->
    <path d="M 148 115 Q 200 160 252 115" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.3" />
  </g>
</svg>
