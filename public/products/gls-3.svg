<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_gls3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="glass_sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="30%" stop-color="#34d399" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#059669" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.4" />
    </linearGradient>
    <filter id="shadow_gls3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#10b981" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="36" fill="url(#bg_gls3)" />
  <rect x="2" y="2" width="396" height="396" rx="34" fill="none" stroke="#10b981" stroke-opacity="0.25" stroke-width="2" />

  <circle cx="200" cy="200" r="135" fill="#10b981" opacity="0.08" />

  <!-- Tempered Glass Screen Protector (Centered at cx=200, cy=200) -->
  <g filter="url(#shadow_gls3)">
    <!-- Black Silk Printed Border Edge -->
    <rect x="135" y="75" width="130" height="250" rx="28" fill="#0f172a" stroke="#10b981" stroke-width="2" />
    
    <!-- Ultra Clear Tempered Glass Window -->
    <rect x="140" y="80" width="120" height="240" rx="24" fill="url(#glass_sheen)" stroke="#6ee7b7" stroke-width="1.5" />

    <!-- Speaker Earpiece Cutout (Top) -->
    <rect x="180" y="88" width="40" height="4" rx="2" fill="#0f172a" />
    <circle cx="200" cy="102" r="3.5" fill="#0f172a" />

    <!-- 9H Hardness Badge (Center) -->
    <circle cx="200" cy="200" r="28" fill="#064e3b" stroke="#34d399" stroke-width="2" />
    <text x="200" y="206" font-family="sans-serif" font-size="16" font-weight="900" fill="#6ee7b7" text-anchor="middle">9H</text>

    <!-- Diagonal Glass Glare Reflection Line -->
    <path d="M 148 110 L 252 214" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.5" />
    <path d="M 148 130 L 252 234" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />
  </g>
</svg>
