<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_hld13" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#312e81" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="holder_body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow_hld13" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#6366f1" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="36" fill="url(#bg_hld13)" />
  <rect x="2" y="2" width="396" height="396" rx="34" fill="none" stroke="#6366f1" stroke-opacity="0.25" stroke-width="2" />

  <circle cx="200" cy="200" r="135" fill="#6366f1" opacity="0.08" />

  <!-- Car Vent / Desktop Phone Holder (Centered at cx=200, cy=200) -->
  <g filter="url(#shadow_hld13)">
    <!-- Base / Stand Pillar (Bottom) -->
    <path d="M 180 260 L 220 260 L 230 310 L 170 310 Z" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <rect x="150" y="305" width="100" height="14" rx="7" fill="#0f172a" stroke="#6366f1" stroke-width="2" />

    <!-- Joint Ball (Center) -->
    <circle cx="200" cy="225" r="18" fill="#475569" stroke="#6366f1" stroke-width="2" />

    <!-- Magnetic Mounting Plate / Cradle -->
    <rect x="135" y="115" width="130" height="140" rx="28" fill="url(#holder_body)" stroke="#818cf8" stroke-width="2.5" />

    <!-- MagSafe Ring Texture -->
    <circle cx="200" cy="185" r="38" fill="none" stroke="#6366f1" stroke-width="4" stroke-dasharray="12 4" />
    <circle cx="200" cy="185" r="16" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" />
    <circle cx="200" cy="185" r="6" fill="#38bdf8" />

    <!-- Side Clamping Arms (Left & Right) -->
    <rect x="120" y="160" width="15" height="48" rx="6" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <rect x="265" y="160" width="15" height="48" rx="6" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <!-- Bottom Support Pegs -->
    <rect x="165" y="245" width="16" height="12" rx="4" fill="#6366f1" />
    <rect x="219" y="245" width="16" height="12" rx="4" fill="#6366f1" />
  </g>
</svg>
