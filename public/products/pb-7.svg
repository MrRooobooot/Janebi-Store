<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_pb7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="pb_metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151" />
      <stop offset="50%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <filter id="shadow_pb7" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#f59e0b" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="36" fill="url(#bg_pb7)" />
  <rect x="2" y="2" width="396" height="396" rx="34" fill="none" stroke="#f59e0b" stroke-opacity="0.25" stroke-width="2" />

  <circle cx="200" cy="200" r="135" fill="#f59e0b" opacity="0.08" />

  <!-- PowerBank Body (Centered at cx=200, cy=200) -->
  <g filter="url(#shadow_pb7)">
    <!-- Aluminum Shell -->
    <rect x="135" y="85" width="130" height="230" rx="28" fill="url(#pb_metal)" stroke="#f59e0b" stroke-width="2.5" />

    <!-- Top Ports Bezel -->
    <rect x="145" y="95" width="110" height="30" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <!-- USB-A Port 1 -->
    <rect x="153" y="103" width="22" height="14" rx="3" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
    <!-- Type-C In/Out Port -->
    <rect x="187" y="105" width="26" height="10" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <!-- USB-A Port 2 -->
    <rect x="225" y="103" width="22" height="14" rx="3" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />

    <!-- Digital LED Percentage Display -->
    <rect x="160" y="160" width="80" height="50" rx="16" fill="#0f172a" stroke="#f59e0b" stroke-width="2" />
    <text x="195" y="195" font-family="monospace" font-size="24" font-weight="900" fill="#fbbf24" text-anchor="middle">100</text>
    <text x="225" y="185" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fbbf24">%</text>

    <!-- 65W Fast Charge Badge -->
    <rect x="165" y="245" width="70" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="200" y="262" font-family="sans-serif" font-size="11" font-weight="900" fill="#38bdf8" text-anchor="middle">65W PD</text>
  </g>
</svg>
